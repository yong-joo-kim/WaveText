[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavetext"
version = "0.1.6"
description = "음성학습용 Wave/Text 쌍 생성기"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8", "numpy>=2.0", "scipy>=1.13", "websocket-client>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.10"]

[project.gui-scripts]
wavetext = "wavetext.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: 실제 음성인식 서버가 필요한 시험 (-m live 로 실행)"]
addopts = "-m 'not live'"
